openapi: 3.1.0
info:
  title: fluxpeer control-server API
  version: "1"
  description: >
    Open coordination-plane API. Versioned under /api/v1.
    No billing — that is the closed fluxpeer.com cloud.
    This schema covers the core endpoints; some admin/stats routes are omitted.
  license:
    name: BSD-3-Clause
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200": { description: ok }
  /version:
    get:
      summary: API + protocol versions
      responses:
        "200":
          description: version info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
  /networks:
    get:
      summary: List networks
      responses:
        "200":
          description: networks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Network" } }
    post:
      summary: Create a network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Network" }
  /networks/{id}/invites:
    post:
      summary: Create an enrollment invite
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_uses: { type: integer, nullable: true }
                expires_at: { type: integer, nullable: true, description: unix seconds }
      responses:
        "201":
          description: created
          content: { application/json: { schema: { $ref: "#/components/schemas/Invite" } } }
        "404": { description: network not found }
  /networks/{id}/devices:
    get:
      summary: List devices in a network
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: devices
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } }
        "404": { description: network not found }
  /networks/{id}/relays:
    get:
      summary: List relays usable by a network (scoped + shared)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: relays
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RelayNode" } } } }
  /networks/{id}/resolve/{name}:
    get:
      summary: MagicDNS — resolve a device name to its overlay IP
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: resolved }
        "404": { description: name not found }
  /enroll/challenge:
    post:
      summary: Begin proof of possession for an enrollment key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wg_public_key]
              properties:
                wg_public_key: { type: string, description: Exactly 32 bytes in hex or padded WireGuard base64 }
      responses:
        "200":
          description: Single-use challenge with 60-second expiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_id: { type: string }
                  server_pub: { type: string, description: Server ephemeral public key in lowercase hex }
        "400": { description: invalid key or challenge capacity exhausted }
  /networks/{id}/devices/import:
    post:
      summary: Atomically import devices with canonical public keys (administrator only)
      description: Accepts exactly 32-byte keys in hex or padded WireGuard base64. Stores lowercase hex and skips existing active keys. Revoked identities do not block imports.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [devices]
              properties:
                devices:
                  type: array
                  items:
                    type: object
                    required: [name, wg_public_key]
                    properties:
                      name: { type: string }
                      wg_public_key: { type: string, description: Exactly 32 bytes in hex or padded WireGuard base64 }
                      address_v4: { type: string, nullable: true }
                      address_v6: { type: string, nullable: true }
                      endpoints: { type: array, items: { type: string } }
      responses:
        "201": { description: Created devices and skipped canonical active keys }
        "400": { description: invalid public key or IPv4 address }
        "401": { description: administrator authentication required }
        "404": { description: network not found }
        "409": { description: active identity/address uniqueness conflict }
  /enroll:
    post:
      summary: Enroll a device or rotate the token of its existing active identity
      description: An existing unexpired network invite and proof of key possession are required. Active re-entry preserves the device and address without consuming another invite use. A revoked key may enroll a new device using a new valid invitation; it consumes a use and receives a new ID, token and address lease without inheriting old routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code, name, wg_public_key, challenge_id, proof]
              properties:
                challenge_id: { type: string }
                proof: { type: string, description: Hex-encoded possession proof from the enrollment challenge }
                invite_code: { type: string }
                name: { type: string }
                wg_public_key: { type: string, description: 32-byte Curve25519 key in hex or padded WireGuard base64 }
      responses:
        "201":
          description: enrolled
          content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } }
        "400": { description: malformed public key or request }
        "401": { description: missing or invalid possession proof }
        "403": { description: invalid/expired/used invite }
        "409": { description: address pool exhausted or active identity/address uniqueness conflict }
  /devices/{id}:
    delete:
      summary: Revoke a device
      description: Invalidates its token and releases addresses while retaining a tombstone. The same key can re-enroll as a new device with a new valid invitation and proof of possession.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: revoked }
        "404": { description: device not found }
  /devices/{id}/config:
    get:
      summary: Pull a device's config (peers + allowed-ips)
      description: Accepts the master bearer, a live administrator session, or this device's own token. Other device tokens are forbidden.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: config
          content: { application/json: { schema: { $ref: "#/components/schemas/DeviceConfig" } } }
        "401": { description: missing or invalid bearer }
        "403": { description: token belongs to another device }
        "404": { description: device not found or revoked }
  /devices/{id}/watch:
    get:
      summary: WebSocket — push DeviceConfig on connect and on every epoch change
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "101": { description: switching protocols (websocket) }
  /devices/{id}/routes:
    post:
      summary: Advertise a subnet route from a device (Subnet Router)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix]
              properties: { prefix: { type: string, example: 192.168.1.0/24 } }
      responses:
        "201":
          description: created (unapproved)
          content: { application/json: { schema: { $ref: "#/components/schemas/Route" } } }
        "404": { description: device not found }
  /routes/{id}/approve:
    post:
      summary: Approve a subnet route (distributes it in peer allowed-ips)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: approved }
        "404": { description: route not found }
  /relays:
    post:
      summary: Register a relay node (omit network_id for shared/official)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, url]
              properties:
                region: { type: string }
                url: { type: string, description: "Relay host:port; IP literals and DNS names are supported" }
                network_id: { type: string, nullable: true }
                anytls: { type: boolean, default: false }
                stun_url: { type: string, nullable: true, description: "UDP STUN host:port; defaults to url" }
                node_id:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 128
                  pattern: '^[!-~]{1,128}$'
                  description: "Actual relay transport identity, matching FLUXPEER_RELAY_NODE_ID. Omitted/null preserves legacy client fallback."
      responses:
        "400": { description: invalid transport identity (requires 1-128 visible ASCII characters) }
        "201":
          description: created
          content: { application/json: { schema: { $ref: "#/components/schemas/RelayNode" } } }
components:
  schemas:
    VersionInfo:
      type: object
      properties:
        server_api_version: { type: string }
        client_protocol_version: { type: integer }
        server_protocol_version: { type: integer }
        relay_protocol_version: { type: integer }
        min_supported_client_protocol_version: { type: integer }
        min_supported_server_protocol_version: { type: integer }
    Network:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ipv4_pool: { type: string }
        ipv6_ula: { type: string }
        config_epoch: { type: integer }
    Device:
      type: object
      properties:
        id: { type: string }
        network_id: { type: string }
        name: { type: string }
        wg_public_key: { type: string, description: Canonical lowercase hex for active devices; revoked legacy records may retain malformed original keys }
        address_v4: { type: string, nullable: true }
        address_v6: { type: string, nullable: true }
        status: { type: string, enum: [active, revoked] }
    Invite:
      type: object
      properties:
        code: { type: string }
        network_id: { type: string }
        expires_at: { type: integer, nullable: true }
        max_uses: { type: integer, nullable: true }
        uses: { type: integer }
    Route:
      type: object
      properties:
        id: { type: string }
        network_id: { type: string }
        device_id: { type: string }
        prefix: { type: string }
        approved: { type: boolean }
    RelayNode:
      type: object
      properties:
        id: { type: string }
        region: { type: string }
        url: { type: string }
        network_id: { type: string, nullable: true }
        anytls: { type: boolean, default: false }
        stun_url: { type: string, nullable: true, description: "UDP STUN host:port" }
        node_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
          pattern: '^[!-~]{1,128}$'
          description: "Relay-reported transport identity, distinct from id; null on legacy registrations"
    PeerConfig:
      type: object
      properties:
        wg_public_key: { type: string, pattern: "^[0-9a-f]{64}$", description: Canonical lowercase hex public key }
        allowed_ips: { type: array, items: { type: string } }
        endpoints: { type: array, items: { type: string } }
        exit:
          type: boolean
          description: this peer has an approved default route (0.0.0.0/0 or ::/0)
    DeviceConfig:
      type: object
      properties:
        network_id: { type: string }
        config_epoch: { type: integer }
        address_v4: { type: string, nullable: true }
        address_v6: { type: string, nullable: true }
        peers: { type: array, items: { $ref: "#/components/schemas/PeerConfig" } }
        self_exit:
          type: boolean
          description: this device itself has an approved default route (is an exit)
