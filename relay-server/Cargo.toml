[package]
name = "fluxpeer-relay-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "relay-server"
path = "src/main.rs"

[dependencies]
fp-crypto = { path = "../engine/crypto/fp-crypto" }
blake2 = { workspace = true }
hmac = { workspace = true }
async-trait = { workspace = true }
getrandom = "0.2"
zeroize = "1"
hex = "0.4"
libc = "0.2"
thiserror = { workspace = true }
parking_lot = "0.12"
tokio = { workspace = true, features = ["sync", "net", "rt-multi-thread", "macros", "io-util", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fp-transport-anytls = { path = "../engine/transport/fp-transport-anytls" }
fp-transport = { path = "../engine/transport/fp-transport" }
fp-transport-tcp-bond = { path = "../engine/transport/fp-transport-tcp-bond" }
fp-disco = { path = "../engine/net/fp-disco" }

[dev-dependencies]
tokio-util = { workspace = true, features = ["compat"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { workspace = true, features = ["sync", "net", "rt-multi-thread", "macros", "io-util", "time"] }
